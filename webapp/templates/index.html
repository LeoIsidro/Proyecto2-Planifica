<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SYNTH_LAB | ENGINE_01</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      surface: "#131313", "surface-container-low": "#1c1b1b", "surface-container": "#20201f",
      "surface-container-high": "#2a2a2a", "surface-container-highest": "#353535", "surface-variant": "#353535",
      "surface-bright": "#393939", primary: "#ffffff", "on-primary": "#2f3131",
      "on-surface": "#e5e2e1", "on-surface-variant": "#c4c7c8", "outline-variant": "#444748",
      outline: "#8e9192", error: "#ffb4ab"
    },
    fontFamily: { display: ["Geist"], body: ["Inter"], mono: ["JetBrains Mono"] }
  } }
}
</script>
<style>
  body { background:#000; color:#e5e2e1; margin:0; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:#0a0a0a; }
  ::-webkit-scrollbar-thumb { background:#262626; }
  .mono { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; }
  .tiny { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.05em; }
  .status-cursor { display:inline-block; width:8px; height:12px; background:#fff; animation:blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .shimmer { background:linear-gradient(90deg,#0a0a0a 25%,#1c1b1b 50%,#0a0a0a 75%); background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
</style>
</head>
<body class="bg-black font-body text-on-surface">

<nav class="fixed top-0 w-full h-14 bg-surface border-b border-outline-variant flex items-center justify-between px-4 z-50">
  <div class="flex items-center gap-8">
    <span class="font-display text-2xl font-semibold tracking-tighter text-primary uppercase">SYNTH_LAB</span>
    <span class="hidden md:block tiny text-on-surface-variant border-b border-primary py-1">WORKSPACE</span>
  </div>
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2 px-3 py-1 bg-surface-container-highest border border-outline-variant">
      <span class="material-symbols-outlined text-sm">memory</span>
      <span class="tiny" id="device-badge">AUTO</span>
    </div>
    <a class="tiny text-on-surface-variant hover:text-primary px-3 py-1 border border-outline-variant" href="/apidocs/" target="_blank">SWAGGER</a>
  </div>
</nav>

<aside class="fixed left-0 top-14 bottom-0 w-56 bg-surface border-r border-outline-variant flex flex-col py-3 z-40">
  <div class="px-4 mb-6">
    <div class="flex items-center gap-3 mb-1">
      <div class="w-6 h-6 bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-black text-sm">grid_view</span></div>
      <h2 class="font-display text-lg font-medium text-primary">ENGINE_01</h2>
    </div>
    <p class="tiny text-on-surface-variant opacity-60">v2.4.0-stable</p>
  </div>
  <div class="px-3 flex-1 flex flex-col gap-1">
    <span class="flex items-center gap-3 px-3 py-2 text-black bg-primary mono"><span class="material-symbols-outlined">grid_view</span>Workspace</span>
  </div>
  <div class="px-3 mt-auto border-t border-outline-variant pt-4 tiny text-on-surface-variant">
    <div class="flex justify-between"><span>NODE</span><span>ENGINE_01</span></div>
    <div class="flex justify-between"><span>STATUS</span><span id="node-status">IDLE</span></div>
  </div>
</aside>

<main class="ml-56 mt-14 h-[calc(100vh-3.5rem)] flex overflow-hidden">
  <section class="flex-1 bg-black p-4 flex flex-col overflow-hidden">
    <div class="flex justify-between items-center mb-4 border-b border-outline-variant pb-2">
      <div class="flex items-center gap-4">
        <span class="mono text-primary">REAL_TIME_STREAM.exe</span>
        <div class="flex items-center gap-2" id="stream-indicator" hidden>
          <span class="status-cursor"></span><span class="tiny text-primary">GENERATING...</span>
        </div>
      </div>
      <span class="tiny text-on-surface-variant" id="progress-label">0 / 5</span>
    </div>
    <div class="h-1 bg-surface-container-low mb-4 hidden" id="progress-track"><div class="h-full bg-primary transition-all duration-300" id="progress-bar" style="width:0%"></div></div>
    <div class="grid grid-cols-2 xl:grid-cols-3 gap-3 overflow-y-auto pr-1" id="grid"></div>
  </section>

  <aside class="w-80 border-l border-outline-variant bg-surface flex flex-col h-full overflow-y-auto">
    <div class="p-3 border-b border-outline-variant">
      <h3 class="mono uppercase text-on-surface-variant mb-3">Compute Node</h3>
      <div class="grid grid-cols-3 border border-outline-variant" id="device-group">
        <button class="py-2 mono text-on-surface-variant border-r border-outline-variant" data-device="cpu">CPU</button>
        <button class="py-2 mono text-on-surface-variant border-r border-outline-variant" data-device="gpu">GPU</button>
        <button class="py-2 mono bg-primary text-black" data-device="auto">AUTO</button>
      </div>
    </div>

    <div class="p-3 border-b border-outline-variant">
      <h3 class="mono uppercase text-on-surface-variant mb-3">Input Source</h3>
      <div class="grid grid-cols-2 border border-outline-variant mb-3" id="source-group">
        <button class="py-2 mono bg-primary text-black border-r border-outline-variant" data-source="dataset">REPOSITORY</button>
        <button class="py-2 mono text-on-surface-variant" data-source="upload">UPLOAD</button>
      </div>
      <div id="dataset-panel">
        <select class="w-full bg-surface-container-low border border-outline-variant p-2 mono text-on-surface mb-2" id="scene-select"></select>
        <img class="w-full aspect-video object-cover border border-outline-variant mb-2 hidden" id="scene-preview" alt="preview"/>
        <details class="border border-outline-variant">
          <summary class="px-3 py-2 tiny text-on-surface-variant cursor-pointer select-none">REPOSITORIO REMOTO</summary>
          <div class="p-2 max-h-48 overflow-y-auto" id="dataset-list"><div class="tiny text-on-surface-variant p-2">Cargando...</div></div>
        </details>
      </div>
      <div id="upload-panel" hidden>
        <input class="w-full mono text-on-surface-variant file:mr-2 file:py-2 file:px-3 file:border file:border-outline-variant file:bg-surface-container-high file:text-on-surface file:mono" id="upload-input" type="file" accept="image/*"/>
        <p class="tiny text-on-surface-variant mt-2 opacity-70">Requiere GPU para velocidad razonable.</p>
      </div>
    </div>

    <div class="p-3 border-b border-outline-variant">
      <button class="w-full py-3 bg-primary text-black mono hover:bg-surface-bright transition-colors disabled:opacity-40" id="generate-btn">GENERATE 5 VARIATIONS</button>
      <p class="tiny text-on-surface-variant mt-2" id="status-text">Listo.</p>
    </div>

    <div class="p-3 flex-1">
      <h3 class="mono uppercase text-on-surface-variant mb-3">Reporte del Agente</h3>
      <button class="w-full py-2 border border-outline-variant tiny text-on-surface-variant hover:bg-surface-container-highest transition-colors mb-3" id="report-btn">GENERAR REPORTE</button>
      <div class="p-3 bg-surface-container border border-outline-variant tiny text-on-surface-variant leading-relaxed whitespace-pre-wrap hidden" id="report-output"></div>
    </div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
